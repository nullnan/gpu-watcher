[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-watcher"
version = "0.1.0"
description = "Priority queue GPU task dispatcher using SSH and tmux only on GPU hosts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9,<4",
  "argon2-cffi>=23.1,<26",
  "tomlkit>=0.13,<1",
]

[project.scripts]
gpu-watcher = "gpu_watcher.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
gpu_watcher = ["web/*.html", "web/*.css", "web/*.js", "web/*.ico", "web/vendor/*.css", "web/vendor/*.js", "web/vendor/*.woff2", "web/vendor/*.txt"]

[tool.setuptools.packages.find]
include = ["gpu_watcher*"]
